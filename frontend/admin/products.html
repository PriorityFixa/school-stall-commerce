<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products & Inventory | School Stall</title>

  <style>
    * { box-sizing: border-box; }

    body { margin: 0; font-family: Arial, sans-serif; background: #f5f6f8; color: #172033; }

    header { background: #172033; color: white; padding: 20px; }
    header h1 { margin: 0 0 5px; font-size: 22px; }
    header p { margin: 0; opacity: 0.75; font-size: 14px; }

    main { width: 100%; max-width: 1100px; margin: auto; padding: 20px; }

    .back-link { display: inline-block; margin-bottom: 20px; color: #172033; text-decoration: none; font-weight: bold; }

    .card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 3px 15px rgba(0,0,0,0.06); }
    .card h2 { margin-top: 0; font-size: 19px; }

    .form-grid { display: grid; gap: 14px; }

    label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 6px; }

    input, select { width: 100%; padding: 12px; border: 1px solid #d8dce3; border-radius: 9px; font-size: 15px; background: white; }

    button { border: none; border-radius: 9px; padding: 12px 16px; font-size: 14px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .primary { background: #172033; color: white; }
    .secondary { background: #e9edf3; color: #172033; }
    .danger { background: #b42318; color: white; }
    .success { background: #18794e; color: white; }

    .message { padding: 12px; border-radius: 8px; margin-top: 14px; display: none; font-size: 14px; }
    .message.show { display: block; }
    .message.success-message { background: #e7f6ed; color: #17633f; }
    .message.error-message { background: #fdecec; color: #a61b1b; }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 850px; }

    th, td { text-align: left; padding: 13px 10px; border-bottom: 1px solid #e7e9ed; font-size: 14px; }
    th { background: #f8f9fb; font-size: 13px; }

    tr.inactive td { opacity: .55; }

    .stock-good { color: #18794e; font-weight: bold; }
    .stock-low { color: #b54708; font-weight: bold; }
    .stock-out { color: #b42318; font-weight: bold; }
    .stock-inactive { color: #687386; font-weight: bold; }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button { padding: 8px 10px; font-size: 12px; }

    .empty { text-align: center; padding: 30px; color: #687386; }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 3px 12px rgba(0,0,0,0.05); }
    .stat-label { font-size: 12px; color: #687386; margin-bottom: 5px; }
    .stat-value { font-size: 23px; font-weight: bold; }

    @media (min-width: 700px) {
      .form-grid { grid-template-columns: repeat(2, 1fr); }
      .full { grid-column: 1 / -1; }
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>

<body>

<header>
  <h1>Products & Inventory</h1>
  <p>Manage products, prices and stock</p>
</header>

<main>

  <a class="back-link" href="../../index.html">← Back to Admin Dashboard</a>

  <div class="stats">
    <div class="stat"><div class="stat-label">Products</div><div class="stat-value" id="productCount">0</div></div>
    <div class="stat"><div class="stat-label">Active Products</div><div class="stat-value" id="activeCount">0</div></div>
    <div class="stat"><div class="stat-label">Stock Units</div><div class="stat-value" id="stockCount">0</div></div>
    <div class="stat"><div class="stat-label">Low Stock (active)</div><div class="stat-value" id="lowStockCount">0</div></div>
  </div>

  <section class="card">
    <h2>Add Product</h2>

    <form id="productForm">
      <div class="form-grid">
        <div class="full">
          <label for="name">Product Name</label>
          <input id="name" type="text" maxlength="120" placeholder="e.g. Samosa" required>
        </div>

        <div>
          <label for="sellingPrice">Selling Price (KES)</label>
          <input id="sellingPrice" type="number" min="0.01" step="0.01" placeholder="50" required>
        </div>

        <div>
          <label for="costPrice">Cost Price (KES)</label>
          <input id="costPrice" type="number" min="0" step="0.01" placeholder="30" value="0">
        </div>

        <div>
          <label for="openingStock">Opening Stock</label>
          <input id="openingStock" type="number" min="0" step="1" placeholder="20" value="0">
        </div>

        <div>
          <label for="reorderLevel">Reorder Level</label>
          <input id="reorderLevel" type="number" min="0" step="1" placeholder="5" value="5">
        </div>

        <div class="full">
          <button type="submit" class="primary" id="addProductButton">Add Product</button>
        </div>
      </div>
    </form>

    <div id="formMessage" class="message"></div>
  </section>

  <section class="card">
    <h2>Product Inventory</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Selling Price</th>
            <th>Cost</th>
            <th>Stock</th>
            <th>Reorder</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <tr><td colspan="7" class="empty">Loading products...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="../admin-auth.js"></script>
<script>
"use strict";

const api = StallAdmin.api;

let products = [];

function money(amount) {
  return "KES " + Number(amount || 0).toLocaleString("en-KE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showMessage(message, type = "success-message") {
  const box = document.getElementById("formMessage");
  box.textContent = message;
  box.className = "message show " + type;
}

/* ---------------- LOAD + RENDER ---------------- */

async function loadProducts() {
  try {
    const data = await api("/api/products");
    products = data.products || [];
    renderProducts();
  } catch (error) {
    console.error(error);

    document.getElementById("productTable").innerHTML = `
      <tr><td colspan="7" class="empty">Failed to load products. ${escapeHtml(error.message)}</td></tr>`;
  }
}

function renderProducts() {
  const table = document.getElementById("productTable");

  const isActive = product => product.active !== false;
  const activeProducts = products.filter(isActive);

  const totalStock = products.reduce((sum, p) => sum + Number(p.stockQuantity || 0), 0);

  // Low stock only counts active products, matching the dashboard.
  const lowStock = activeProducts.filter(
    p => Number(p.stockQuantity || 0) <= Number(p.reorderLevel || 0)
  );

  document.getElementById("productCount").textContent = products.length;
  document.getElementById("activeCount").textContent = activeProducts.length;
  document.getElementById("stockCount").textContent = totalStock;
  document.getElementById("lowStockCount").textContent = lowStock.length;

  if (!products.length) {
    table.innerHTML = `
      <tr><td colspan="7" class="empty">No products yet. Add your first product above.</td></tr>`;
    return;
  }

  table.innerHTML = products.map(product => {
    const stock = Number(product.stockQuantity || 0);
    const reorder = Number(product.reorderLevel || 0);
    const active = isActive(product);

    let stockClass = "stock-good";
    let stockLabel = "In stock";

    if (!active) {
      stockClass = "stock-inactive";
      stockLabel = "Inactive (hidden from sellers)";
    } else if (stock === 0) {
      stockClass = "stock-out";
      stockLabel = "Out of stock";
    } else if (stock <= reorder) {
      stockClass = "stock-low";
      stockLabel = "Low stock";
    }

    const id = escapeHtml(product.id);

    return `
      <tr class="${active ? "" : "inactive"}">
        <td><strong>${escapeHtml(product.name)}</strong></td>
        <td>${money(product.sellingPrice)}</td>
        <td>${money(product.costPrice)}</td>
        <td><strong>${stock}</strong></td>
        <td>${reorder}</td>
        <td class="${stockClass}">${stockLabel}</td>
        <td>
          <div class="actions">
            <button class="success" data-action="add" data-id="${id}">+ Stock</button>
            <button class="secondary" data-action="remove" data-id="${id}">− Stock</button>
            <button class="secondary" data-action="edit" data-id="${id}">Edit</button>
            <button class="${active ? "danger" : "primary"}" data-action="toggle" data-id="${id}">
              ${active ? "Deactivate" : "Activate"}
            </button>
          </div>
        </td>
      </tr>`;
  }).join("");
}

document.getElementById("productTable").addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const id = button.dataset.id;

  switch (button.dataset.action) {
    case "add": return addStock(id);
    case "remove": return removeStock(id);
    case "edit": return editProduct(id);
    case "toggle": return toggleActive(id);
  }
});

/* ---------------- ADD PRODUCT ---------------- */

document.getElementById("productForm").addEventListener("submit", async event => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const sellingPrice = Number(document.getElementById("sellingPrice").value);
  const costPrice = Number(document.getElementById("costPrice").value || 0);
  const openingStock = Number(document.getElementById("openingStock").value || 0);
  const reorderLevel = Number(document.getElementById("reorderLevel").value || 0);

  const button = document.getElementById("addProductButton");
  button.disabled = true;

  try {
    await api("/api/products", {
      method: "POST",
      body: JSON.stringify({ name, sellingPrice, costPrice, openingStock, reorderLevel })
    });

    showMessage("Product added successfully.");

    document.getElementById("productForm").reset();
    document.getElementById("costPrice").value = 0;
    document.getElementById("openingStock").value = 0;
    document.getElementById("reorderLevel").value = 5;

    await loadProducts();
  } catch (error) {
    console.error(error);
    showMessage(error.message, "error-message");
  } finally {
    button.disabled = false;
  }
});

/* ---------------- EDIT PRODUCT ---------------- */

async function editProduct(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;

  const newName = prompt("Product name:", product.name);
  if (newName === null) return;

  const newPrice = prompt("Selling price (KES):", product.sellingPrice);
  if (newPrice === null) return;

  const newCost = prompt("Cost price (KES):", product.costPrice ?? 0);
  if (newCost === null) return;

  const newReorder = prompt("Reorder level:", product.reorderLevel ?? 0);
  if (newReorder === null) return;

  try {
    await api("/api/products/" + encodeURIComponent(productId), {
      method: "PUT",
      body: JSON.stringify({
        name: newName.trim(),
        sellingPrice: Number(newPrice),
        costPrice: Number(newCost),
        reorderLevel: Number(newReorder)
      })
    });

    showMessage(`${newName.trim()} updated.`);
    await loadProducts();
  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}

/* ---------------- ACTIVATE / DEACTIVATE ---------------- */

async function toggleActive(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;

  const makeActive = product.active === false;

  const question = makeActive
    ? `Make "${product.name}" available for sale again?`
    : `Deactivate "${product.name}"? It will be hidden from sellers and customers.`;

  if (!confirm(question)) return;

  try {
    await api("/api/products/" + encodeURIComponent(productId), {
      method: "PUT",
      body: JSON.stringify({ active: makeActive })
    });

    showMessage(`${product.name} ${makeActive ? "activated" : "deactivated"}.`);
    await loadProducts();
  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}

/* ---------------- STOCK ---------------- */

async function addStock(productId) {
  const quantity = askQuantity("How many units are being added?");
  if (quantity === null) return;

  const reason = prompt("Reason for stock addition:", "Stock received");
  if (reason === null) return;

  await adjustStock(productId, quantity, reason);
}

async function removeStock(productId) {
  const quantity = askQuantity("How many units are being removed?");
  if (quantity === null) return;

  const reason = prompt("Reason for stock removal:", "Stock correction");
  if (reason === null) return;

  await adjustStock(productId, -quantity, reason);
}

function askQuantity(question) {
  const amount = prompt(question);
  if (amount === null) return null;

  const quantity = Number(amount);

  if (!Number.isInteger(quantity) || quantity <= 0) {
    alert("Enter a whole number greater than zero.");
    return null;
  }

  return quantity;
}

async function adjustStock(productId, change, reason) {
  try {
    await api("/api/inventory/" + encodeURIComponent(productId) + "/adjust", {
      method: "POST",
      body: JSON.stringify({ change, reason })
    });

    await loadProducts();
  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}

loadProducts();
</script>

</body>
</html>
