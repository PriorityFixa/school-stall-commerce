<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orders | School Stall</title>

  <style>
    * { box-sizing: border-box; }

    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #172033; }

    header { background: #172033; color: white; padding: 18px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; opacity: 0.8; font-size: 14px; }

    .container { max-width: 1100px; margin: auto; padding: 18px; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
    }

    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .back-btn, .refresh-btn, .link-btn {
      border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer;
      font-weight: bold; font-size: 14px; text-decoration: none; display: inline-block;
    }

    .back-btn, .link-btn { background: #e8edf3; color: #172033; }
    .refresh-btn { background: #172033; color: white; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }

    .stat { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-label { font-size: 13px; color: #667085; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: bold; overflow-wrap: anywhere; }

    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .card h2 { margin-top: 0; font-size: 18px; }

    .status { display: inline-block; padding: 5px 9px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .paid { background: #dcfce7; color: #166534; }
    .pending { background: #fef3c7; color: #92400e; }
    .partial { background: #ffedd5; color: #9a3412; }
    .unpaid { background: #fee2e2; color: #991b1b; }
    .completed { background: #dbeafe; color: #1d4ed8; }

    .order { border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }

    .order-header { background: #f8fafc; padding: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .order-id { font-weight: bold; overflow-wrap: anywhere; }
    .order-date { color: #667085; font-size: 13px; }

    .order-body { padding: 14px; }

    .order-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 15px; }
    .info-label { display: block; font-size: 12px; color: #667085; margin-bottom: 3px; }
    .info-value { font-weight: 600; overflow-wrap: anywhere; }

    .items { border-top: 1px solid #eee; padding-top: 12px; }
    .item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .item:last-child { border-bottom: none; }

    .order-total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 2px solid #172033; font-size: 18px; font-weight: bold; }

    .order-balance { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; color: #475467; }
    .order-balance strong.owed { color: #b42318; }

    .payments { margin-top: 12px; font-size: 13px; color: #475467; }
    .payments summary { cursor: pointer; font-weight: bold; }
    .payments li { margin: 4px 0; }

    .empty { text-align: center; padding: 40px 20px; color: #667085; }

    .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }

    @media (max-width: 800px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .order-info { grid-template-columns: repeat(2, 1fr); }
      .order-header { flex-direction: column; }
    }

    @media (max-width: 420px) {
      .container { padding: 12px; }
      .stats, .order-info { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  <h1>School Stall — Orders</h1>
  <p>View sales and payment status</p>
</header>

<div class="container">

  <div class="topbar">
    <a class="back-btn" href="../../index.html">← Dashboard</a>

    <div class="topbar-actions">
      <a class="link-btn" href="payments.html">Collect Payments</a>
      <button class="refresh-btn" id="refresh-btn" type="button">Refresh</button>
    </div>
  </div>

  <div id="errorBox" class="error"></div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total Orders</div><div class="stat-value" id="totalOrders">0</div></div>
    <div class="stat"><div class="stat-label">Total Sales</div><div class="stat-value" id="totalSales">KSh 0</div></div>
    <div class="stat"><div class="stat-label">Paid Orders</div><div class="stat-value" id="paidOrders">0</div></div>
    <div class="stat"><div class="stat-label">Outstanding</div><div class="stat-value" id="outstanding">KSh 0</div></div>
  </div>

  <div class="card">
    <h2>Recent Orders</h2>
    <div id="ordersList"><div class="empty">Loading orders...</div></div>
  </div>

</div>

<script src="../admin-auth.js"></script>
<script>
"use strict";

const api = StallAdmin.api;

async function loadOrders() {
  const ordersList = document.getElementById("ordersList");
  const errorBox = document.getElementById("errorBox");

  errorBox.style.display = "none";
  ordersList.innerHTML = '<div class="empty">Loading orders...</div>';

  try {
    const data = await api("/api/orders");
    const orders = data.orders || [];

    renderStats(orders);
    renderOrders(orders);
  } catch (error) {
    console.error(error);

    errorBox.textContent = error.message || "Unable to load orders.";
    errorBox.style.display = "block";

    ordersList.innerHTML = '<div class="empty">Could not load orders.</div>';
  }
}

function renderStats(orders) {
  const totalSales = orders.reduce((sum, order) => sum + Number(order.total || 0), 0);
  const outstanding = orders.reduce((sum, order) => sum + Number(order.balance || 0), 0);
  const paidOrders = orders.filter(order => order.paymentStatus === "PAID").length;

  document.getElementById("totalOrders").textContent = orders.length;
  document.getElementById("totalSales").textContent = formatCurrency(totalSales);
  document.getElementById("paidOrders").textContent = paidOrders;
  document.getElementById("outstanding").textContent = formatCurrency(outstanding);
}

function renderOrders(orders) {
  const container = document.getElementById("ordersList");

  if (!orders.length) {
    container.innerHTML = '<div class="empty">No orders have been recorded yet.</div>';
    return;
  }

  container.innerHTML = orders.map(order => {
    const items = Array.isArray(order.items) ? order.items : [];
    const payments = Array.isArray(order.payments) ? order.payments : [];
    const balance = Number(order.balance || 0);

    const customer = [order.customerName || "Walk-in", order.customerClass]
      .filter(Boolean).join(" · ");

    const fulfilment = order.fulfilment === "classroom" ? "Classroom delivery"
      : order.fulfilment === "collection" ? "Collect at stall" : "";

    return `
      <div class="order">
        <div class="order-header">
          <div>
            <div class="order-id">${escapeHtml(order.id)}</div>
            <div class="order-date">${formatDate(order.createdAt)}</div>
          </div>

          <div>
            <span class="status completed">${escapeHtml(order.status || "completed")}</span>
            <span class="status ${getPaymentClass(order.paymentStatus)}">${escapeHtml(getPaymentLabel(order.paymentStatus))}</span>
          </div>
        </div>

        <div class="order-body">
          <div class="order-info">
            <div><span class="info-label">Seller</span><span class="info-value">${escapeHtml(order.sellerName || "-")}</span></div>
            <div><span class="info-label">Customer</span><span class="info-value">${escapeHtml(customer)}</span></div>
            <div><span class="info-label">Payment</span><span class="info-value">${escapeHtml(order.paymentMethod || "-")}</span></div>
            <div><span class="info-label">Phone</span><span class="info-value">${escapeHtml(order.customerPhone || "-")}</span></div>
            ${fulfilment ? `<div><span class="info-label">Delivery</span><span class="info-value">${fulfilment}</span></div>` : ""}
          </div>

          <div class="items">
            ${items.map(item => `
              <div class="item">
                <div>
                  <strong>${escapeHtml(item.productName || item.name || item.productId)}</strong>
                  <div>${Number(item.quantity || 0)} × ${formatCurrency(item.unitPrice ?? item.sellingPrice ?? 0)}</div>
                </div>
                <div>${formatCurrency(item.lineTotal || 0)}</div>
              </div>
            `).join("")}
          </div>

          <div class="order-total"><span>Total</span><span>${formatCurrency(order.total || 0)}</span></div>

          <div class="order-balance">
            <span>Paid: <strong>${formatCurrency(order.amountPaid || 0)}</strong></span>
            <span>Balance: <strong class="${balance > 0 ? "owed" : ""}">${formatCurrency(balance)}</strong></span>
          </div>

          ${payments.length ? `
            <details class="payments">
              <summary>${payments.length} payment${payments.length === 1 ? "" : "s"} recorded</summary>
              <ul>
                ${payments.map(payment => `
                  <li>
                    ${formatCurrency(payment.amount)} by ${escapeHtml(payment.method)}
                    ${payment.reference ? `(ref ${escapeHtml(payment.reference)})` : ""}
                    — ${escapeHtml(payment.recordedBy || "")}, ${formatDate(payment.createdAt)}
                  </li>
                `).join("")}
              </ul>
            </details>` : ""}
        </div>
      </div>`;
  }).join("");
}

function getPaymentClass(status) {
  if (status === "PAID") return "paid";
  if (status === "PARTIALLY_PAID") return "partial";
  if (status === "UNPAID") return "unpaid";
  return "pending";
}

function getPaymentLabel(status) {
  if (status === "PAID") return "Paid";
  if (status === "PARTIALLY_PAID") return "Partially Paid";
  if (status === "PENDING") return "Payment Pending";
  if (status === "UNPAID") return "Unpaid";
  return status || "Unknown";
}

function formatCurrency(amount) {
  return "KSh " + Number(amount || 0).toLocaleString("en-KE", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
}

function formatDate(date) {
  if (!date) return "-";

  const parsed = new Date(date);
  if (isNaN(parsed.getTime())) return escapeHtml(date);

  return parsed.toLocaleString("en-KE", { dateStyle: "medium", timeStyle: "short" });
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.getElementById("refresh-btn").addEventListener("click", loadOrders);

loadOrders();
</script>

</body>
</html>
