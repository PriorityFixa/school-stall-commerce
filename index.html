<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Stall Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    header { background: #172033; color: white; padding: 20px; }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 6px 0 0; opacity: 0.75; font-size: 14px; }

    main { width: min(1100px, 94%); margin: 20px auto 50px; }

    .quick-nav, .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .quick-nav h2, .card h2 { margin: 0 0 14px; font-size: 18px; }

    .nav-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px;
      border-radius: 8px;
      background: #172033;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .nav-link:hover { background: #2b3d5d; transform: translateY(-2px); }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stat-label { font-size: 13px; color: #697386; }
    .stat-value { font-size: 24px; font-weight: bold; margin-top: 6px; overflow-wrap: anywhere; }
    .stat-note { font-size: 11px; color: #697386; margin-top: 4px; }

    form { display: grid; gap: 12px; }
    label { font-size: 14px; font-weight: bold; }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input, select { border: 1px solid #d5d9e0; background: white; }

    button {
      border: 0;
      background: #172033;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

    .message {
      padding: 12px;
      border-radius: 8px;
      background: #eef3ff;
      color: #24467f;
      margin-top: 10px;
      display: none;
      overflow-wrap: anywhere;
    }

    .message.error { background: #fdecea; color: #b42318; }
    .message.success { background: #e4f6e9; color: #176b36; }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf0f4; text-align: left; }
    th { font-size: 13px; color: #697386; }
    .empty { color: #697386; padding: 20px 0; }

    .signout {
      background: transparent;
      border: 1px solid #ffffff55;
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .card, .quick-nav { padding: 16px; }
    }
  </style>
</head>

<body>

<header>
  <h1>School Stall Admin</h1>
  <p>Students, contributions and ownership</p>
  <button class="signout" id="sign-out" type="button">Lock admin pages</button>
</header>

<main>

  <section class="quick-nav">
    <h2>Quick Navigation</h2>

    <nav class="nav-links" aria-label="Management pages">
      <a class="nav-link" href="frontend/admin/contributions.html">Contributions</a>
      <a class="nav-link" href="frontend/admin/orders.html">Orders</a>
      <a class="nav-link" href="frontend/admin/payments.html">Payments</a>
      <a class="nav-link" href="frontend/admin/products.html">Products</a>
      <a class="nav-link" href="frontend/seller.html">Seller Dashboard</a>
    </nav>
  </section>

  <section class="dashboard-grid" id="stats"></section>

  <section class="card">
    <h2>Add Student</h2>

    <form id="student-form">
      <div>
        <label for="student-name">Student name</label>
        <input id="student-name" type="text" placeholder="Enter student name"
          autocomplete="off" maxlength="120" required>
      </div>

      <div>
        <label for="student-role">Role</label>
        <select id="student-role">
          <option value="Member">Member</option>
          <option value="Seller">Seller</option>
          <option value="Treasurer">Treasurer</option>
          <option value="Manager">Manager</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <button id="add-student-button" type="submit">Add Student</button>
    </form>

    <div id="student-message" class="message" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>Record Expense</h2>

    <form id="expense-form">
      <div class="form-row">
        <div>
          <label for="expense-description">Description</label>
          <input id="expense-description" type="text" maxlength="300"
            placeholder="e.g. Cooking oil" autocomplete="off" required>
        </div>

        <div>
          <label for="expense-amount">Amount (KSh)</label>
          <input id="expense-amount" type="number" min="0.01" step="0.01" required>
        </div>

        <div>
          <label for="expense-category">Category</label>
          <select id="expense-category">
            <option value="Supplies">Supplies</option>
            <option value="Transport">Transport</option>
            <option value="Equipment">Equipment</option>
            <option value="General">General</option>
          </select>
        </div>
      </div>

      <button id="add-expense-button" type="submit">Record Expense</button>
    </form>

    <div id="expense-message" class="message" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>Students</h2>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Ownership</th>
          </tr>
        </thead>
        <tbody id="students-table">
          <tr><td colspan="4" class="empty">Loading students...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Ownership</h2>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Contribution</th>
            <th>Ownership</th>
          </tr>
        </thead>
        <tbody id="ownership-table">
          <tr><td colspan="3" class="empty">Loading ownership...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="frontend/admin-auth.js"></script>
<script>
"use strict";

const api = StallAdmin.api;
const $ = id => document.getElementById(id);

/* ---------------- helpers ---------------- */

function formatMoney(amount) {
  return `KSh ${Number(amount || 0).toLocaleString("en-KE", { maximumFractionDigits: 2 })}`;
}

function formatPercent(value) {
  return `${Number(value || 0).toFixed(1)}%`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showMessage(box, text, type) {
  box.style.display = "block";
  box.textContent = text;
  box.className = "message" + (type ? " " + type : "");
}

/* ---------------- dashboard ---------------- */

const STATS = [
  { id: "students", label: "Students", get: d => d.students, fmt: v => v },
  { id: "capital", label: "Approved Capital", get: d => d.totalContributions, fmt: formatMoney },
  { id: "pending", label: "Pending Contributions", get: d => d.pendingContributions, fmt: v => v },
  { id: "sales", label: "Total Sales", note: "Includes unpaid orders", get: d => d.totalSales, fmt: formatMoney },
  { id: "collected", label: "Cash Collected", note: "Payments actually received", get: d => d.totalCollected, fmt: formatMoney },
  { id: "outstanding", label: "Outstanding", note: "Owed by customers", get: d => d.totalOutstanding, fmt: formatMoney },
  { id: "expenses", label: "Expenses", get: d => d.totalExpenses, fmt: formatMoney },
  { id: "profit", label: "Net Profit", note: "Sales - cost of goods - expenses", get: d => d.netProfit, fmt: formatMoney },
  { id: "lowstock", label: "Low-Stock Products", get: d => d.lowStockProducts, fmt: v => v }
];

$("stats").innerHTML = STATS.map(stat => `
  <div class="stat">
    <div class="stat-label">${stat.label}</div>
    <div class="stat-value" id="stat-${stat.id}">0</div>
    ${stat.note ? `<div class="stat-note">${stat.note}</div>` : ""}
  </div>
`).join("");

async function loadDashboard() {
  try {
    const data = await api("/api/dashboard");

    STATS.forEach(stat => {
      $("stat-" + stat.id).textContent = stat.fmt(stat.get(data));
    });
  } catch (error) {
    console.error("Dashboard error:", error);
    STATS.forEach(stat => { $("stat-" + stat.id).textContent = "—"; });
  }
}

/* ---------------- ownership ---------------- */

let ownershipData = [];

async function loadOwnership() {
  const table = $("ownership-table");

  try {
    const data = await api("/api/students/ownership");
    ownershipData = data.ownership || [];

    if (!ownershipData.length || !Number(data.totalApprovedContribution)) {
      table.innerHTML = `
        <tr><td colspan="3" class="empty">No approved contributions yet.</td></tr>`;
      return;
    }

    table.innerHTML = ownershipData.map(item => `
      <tr>
        <td>${escapeHtml(item.studentName)}</td>
        <td>${formatMoney(item.contribution)}</td>
        <td>${formatPercent(item.ownershipPercentage)}</td>
      </tr>
    `).join("");
  } catch (error) {
    console.error("Ownership error:", error);
    ownershipData = [];
    table.innerHTML = `
      <tr><td colspan="3" class="empty">Could not load ownership. ${escapeHtml(error.message)}</td></tr>`;
  }
}

/* ---------------- students ---------------- */

async function loadStudents() {
  const table = $("students-table");

  try {
    const data = await api("/api/students");
    const students = data.students || [];

    if (!students.length) {
      table.innerHTML = `<tr><td colspan="4" class="empty">No students added yet.</td></tr>`;
      return;
    }

    table.innerHTML = students.map(student => {
      const owner = ownershipData.find(item => item.studentId === student.id);
      const percentage = owner ? owner.ownershipPercentage : 0;
      const active = student.status
        ? String(student.status).toLowerCase() === "active"
        : student.active !== false;

      return `
        <tr>
          <td>${escapeHtml(student.name)}</td>
          <td>${escapeHtml(student.role)}</td>
          <td>${active ? "Active" : "Inactive"}</td>
          <td>${formatPercent(percentage)}</td>
        </tr>`;
    }).join("");
  } catch (error) {
    console.error("Students error:", error);
    table.innerHTML = `
      <tr><td colspan="4" class="empty">Could not load students. ${escapeHtml(error.message)}</td></tr>`;
  }
}

/* ---------------- add student ---------------- */

$("student-form").addEventListener("submit", async event => {
  event.preventDefault();

  const name = $("student-name").value.trim();
  const role = $("student-role").value;
  if (!name) return;

  const box = $("student-message");
  showMessage(box, "Adding student...");
  $("add-student-button").disabled = true;

  try {
    await api("/api/students", {
      method: "POST",
      body: JSON.stringify({ name, role })
    });

    showMessage(box, `${name} added successfully.`, "success");
    $("student-form").reset();
    await refresh();
  } catch (error) {
    showMessage(box, error.message || "Could not add student.", "error");
  } finally {
    $("add-student-button").disabled = false;
  }
});

/* ---------------- add expense ---------------- */

$("expense-form").addEventListener("submit", async event => {
  event.preventDefault();

  const description = $("expense-description").value.trim();
  const amount = Number($("expense-amount").value);
  const category = $("expense-category").value;
  const box = $("expense-message");

  if (!description || !Number.isFinite(amount) || amount <= 0) {
    showMessage(box, "Enter a description and an amount greater than zero.", "error");
    return;
  }

  showMessage(box, "Recording expense...");
  $("add-expense-button").disabled = true;

  try {
    await api("/api/expenses", {
      method: "POST",
      body: JSON.stringify({ description, amount, category })
    });

    showMessage(box, `Expense recorded: ${formatMoney(amount)}.`, "success");
    $("expense-form").reset();
    await loadDashboard();
  } catch (error) {
    showMessage(box, error.message || "Could not record expense.", "error");
  } finally {
    $("add-expense-button").disabled = false;
  }
});

/* ---------------- lock ---------------- */

$("sign-out").addEventListener("click", () => {
  StallAdmin.signOut();
  alert("Admin pages locked. The PIN will be requested again on the next action.");
  location.reload();
});

/* ---------------- start ---------------- */

async function refresh() {
  // Load ownership first so the students table can show percentages.
  await Promise.allSettled([loadDashboard(), loadOwnership()]);
  await loadStudents();
}

refresh();
</script>

</body>
</html>
